# axiora-pulse-be/.github/workflows/deploy-prod.yml
#
# Release -> Production. Promotes the QA-tested image (retag, NO rebuild) and
# deploys it to the prod box behind a manual approval gate.
#
#   push to release/x.y.z  ->  promote sha -> prod / YYYY-MM-DD / vX.Y.Z
#                          ->  [approval required]  ->  deploy to prod box
#
# The image for the release commit must already exist in ECR (built & QA-tested on
# develop before the release branch was cut). We promote by digest; never rebuild.
#
# IMPORTANT: the OIDC (promote) job has NO `environment:`, so its OIDC subject
# stays ref-based (repo:...:ref:refs/heads/release/*) and matches the IAM trust
# policy. The `environment: Production` gate is on the deploy job, which uses SSH
# (no OIDC), avoiding the environment-subject mismatch.

name: Deploy production

on:
  push:
    branches: [release/**]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "sha-<...> to promote & deploy (defaults to this commit's sha)"
        required: false
        type: string

concurrency:
  group: deploy-prod-be
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${{ vars.ECR_REGISTRY }}/axiora-pulse-be"
          if [ -n "${{ inputs.image_tag }}" ]; then
            SHA_TAG="${{ inputs.image_tag }}"
          else
            SHA_TAG="sha-${GITHUB_SHA::12}"
          fi
          case "${GITHUB_REF_NAME}" in
            release/*) VERSION="v${GITHUB_REF_NAME#release/}" ;;
            *)         VERSION="" ;;
          esac
          {
            echo "image=$IMAGE"
            echo "sha_tag=$SHA_TAG"
            echo "version=$VERSION"
            echo "date=$(date +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting $IMAGE:$SHA_TAG (version=${VERSION:-none})"

      - name: Verify the image exists (built & QA-tested on develop)
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --repository-name axiora-pulse-be \
            --image-ids imageTag=${{ steps.meta.outputs.sha_tag }} \
            --region ${{ vars.AWS_REGION }} >/dev/null \
          || { echo "::error::Image ${{ steps.meta.outputs.sha_tag }} not in ECR. Build this commit on develop (QA) first."; exit 1; }

      - name: Promote (retag existing image — no rebuild)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}"
          TAGS="--tag $IMAGE:prod --tag $IMAGE:${{ steps.meta.outputs.date }}"
          if [ -n "${{ steps.meta.outputs.version }}" ]; then
            TAGS="$TAGS --tag $IMAGE:${{ steps.meta.outputs.version }}"
          fi
          docker buildx imagetools create $TAGS "$IMAGE:${{ steps.meta.outputs.sha_tag }}"
          echo "Promoted ${{ steps.meta.outputs.sha_tag }} -> prod, ${{ steps.meta.outputs.date }}${{ steps.meta.outputs.version && format(', {0}', steps.meta.outputs.version) }}"

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    environment: Production        # <-- required-reviewer approval gate; SSH only, no OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.PROD_EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync deployment configuration
        env:
          HOST: ${{ secrets.PROD_EC2_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml "ubuntu@$HOST:/opt/axiora/docker-compose.yml"

      - name: Deploy to prod (pull the pinned image)
        env:
          HOST: ${{ secrets.PROD_EC2_HOST }}
          IMAGE_TAG: ${{ needs.promote.outputs.sha_tag }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "ubuntu@$HOST" bash -s <<EOF
            set -euo pipefail
            cd /opt/axiora
            test -f .env
            # Persist both values, including on boxes provisioned before ECR deploys.
            sed -i '/^IMAGE_TAG=/d; /^ECR_REGISTRY=/d' .env
            printf '\nIMAGE_TAG=%s\nECR_REGISTRY=%s\n' "${IMAGE_TAG}" "${REGISTRY}" >> .env
            aws ecr get-login-password --region ${REGION} \
              | docker login --username AWS --password-stdin ${REGISTRY}
            docker compose pull api
            docker compose up -d --no-build api
          EOF

      - name: Health check
        env:
          HOST: ${{ secrets.PROD_EC2_HOST }}
        run: |
          for i in $(seq 1 40); do
            if ssh -i ~/.ssh/id_ed25519 "ubuntu@$HOST" \
                 'docker compose -f /opt/axiora/docker-compose.yml exec -T api curl -fsS localhost:8000/health' 2>/dev/null; then
              echo "Prod API healthy"; exit 0
            fi
            sleep 5
          done
          echo "Prod API did not become healthy. Logs:" >&2
          ssh -i ~/.ssh/id_ed25519 "ubuntu@$HOST" \
            'docker compose -f /opt/axiora/docker-compose.yml logs --tail 80 api' >&2
          exit 1
